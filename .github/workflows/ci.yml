# Сборка, тесты и релизы winralter.
# push/PR: сборка Release x64, тесты, cab-пакет в артефактах.
# Тег v* (например, v2.1): то же самое + проверка версии и релиз на GitHub.

name: CI

on:
  push:
    branches: [trunk]
    tags: ['v2.1']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Сборка
        run: msbuild winralter.sln /m /nologo /p:Configuration=Release /p:Platform=x64

      # ------------------------------------------------------------------
      # Создание CAB
      # ------------------------------------------------------------------
      - name: Пакет CAB
        shell: pwsh
        run: |
          $suffix = if ('${{ github.ref_type }}' -eq 'tag') {
            '${{ github.ref_name }}'
          } else {
            '${{ github.sha }}'.Substring(0, 7)
          }

          $name = "winralter-$suffix-x64"
          $packageDir = (New-Item -ItemType Directory -Force "dist\$name").FullName
          $cabDir = (New-Item -ItemType Directory -Force "dist\cab").FullName

          ls
          # Копируем файлы программы
          Copy-Item `
            x64\Release\winralter.exe `
            $packageDir

          # Получаем список всех файлов
          $files = Get-ChildItem $packageDir -Recurse -File

          # DDF-файл для makecab
          $ddf = Join-Path $env:RUNNER_TEMP "winralter.ddf"

          @"
          .OPTION EXPLICIT
          .Set CabinetNameTemplate=$name.cab
          .Set DiskDirectoryTemplate=$cabDir
          .Set MaxDiskSize=0
          .Set CompressionType=LZX
          .Set CompressionMemory=21
          .Set Cabinet=on
          .Set Compress=on
          .Set InfFileName=NUL

          "@ | Set-Content -Path $ddf -Encoding ASCII

          foreach ($file in $files) {
            $relative = $file.FullName.Substring($packageDir.Length + 1)

            # В DDF нужен путь к исходному файлу и имя внутри CAB
            Add-Content `
              -Path $ddf `
              -Value "`"$($file.FullName)`" `"$relative`""
          }
          
          ls

          Write-Host "Создание CAB..."
          Write-Host "DDF: $ddf"

          makecab.exe /F "$ddf"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "makecab завершился с ошибкой: $LASTEXITCODE"
            exit 1
          }

          $cab = Join-Path $cabDir "$name.cab"

          if (-not (Test-Path $cab)) {
            Write-Error "CAB-файл не создан: $cab"
            exit 1
          }

          Write-Host ""
          Write-Host "Создан пакет:"
          Get-Item $cab | Format-List FullName, Length

      # Проверяем, что CAB действительно существует
      - name: Проверка CAB
        shell: pwsh
        run: |
          Get-ChildItem dist\cab -Filter *.cab

      - uses: actions/upload-artifact@v4
        with:
          name: winralter-x64
          path: dist/cab/*.cab

  # --------------------------------------------------------------------
  # GitHub Release
  # --------------------------------------------------------------------
  release:
    needs: build
    if: github.ref_type == 'tag'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: winralter-x64

      - name: Проверка артефакта
        run: |
          ls -lah
          find . -type f -name '*.cab' -print

      - name: Релиз на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" *.cab \
            --repo "${{ github.repository }}" \
            --title "WinRAlter ${{ github.ref_name }}" \
            --generate-notes
name: Build and publish GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install MFC libraries
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath

          if (-not $vsPath) {
            throw "Visual Studio installation not found"
          }

          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"

          & $installer modify `
            --installPath "$vsPath" `
            --add Microsoft.VisualStudio.Component.VC.ATLMFC `
            --quiet --wait --norestart

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install MFC components"
          }
    
      - name: Build x64
        shell: pwsh
        run: |
          msbuild .\winralter.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
          if (!(Test-Path .\x64\Release\winralter.exe)) {
            throw "x64 Release executable not found at x64\Release\winralter.exe"
          }
          $suffix = if ('${{ github.ref_type }}' -eq 'tag') {
            '${{ github.ref_name }}'
          } else {
            '${{ github.sha }}'.Substring(0, 7)
          }
          $name = "winralter-$suffix-x64"
          $packageDir = (New-Item -ItemType Directory -Force "dist\$name").FullName
          Copy-Item .\x64\Release\winralter.exe .\dist\winralter-x64.exe

      # ------------------------------------------------------------------
      # Создание CAB
      # ------------------------------------------------------------------
      - name: Пакет CAB
        shell: pwsh
        run: |
          $suffix = if ('${{ github.ref_type }}' -eq 'tag') {
            '${{ github.ref_name }}'
          } else {
            '${{ github.sha }}'.Substring(0, 7)
          }

          $name = "winralter-$suffix-x64"
          $packageDir = (New-Item -ItemType Directory -Force "dist\$name").FullName
          $cabDir = (New-Item -ItemType Directory -Force "dist\cab").FullName

          ls
          # Копируем файлы программы
          Copy-Item `
            x64\Release\winralter.exe `
            $packageDir

          # Получаем список всех файлов
          $files = Get-ChildItem $packageDir -Recurse -File

          # DDF-файл для makecab
          $ddf = Join-Path $env:RUNNER_TEMP "winralter.ddf"

          @"
          .OPTION EXPLICIT
          .Set CabinetNameTemplate=$name.cab
          .Set DiskDirectoryTemplate=$cabDir
          .Set MaxDiskSize=0
          .Set CompressionType=LZX
          .Set CompressionMemory=21
          .Set Cabinet=on
          .Set Compress=on
          .Set InfFileName=NUL

          "@ | Set-Content -Path $ddf -Encoding ASCII

          foreach ($file in $files) {
            $relative = $file.FullName.Substring($packageDir.Length + 1)

            # В DDF нужен путь к исходному файлу и имя внутри CAB
            Add-Content `
              -Path $ddf `
              -Value "`"$($file.FullName)`" `"$relative`""
          }
          
          ls

          Write-Host "Создание CAB..."
          Write-Host "DDF: $ddf"

          makecab.exe /F "$ddf"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "makecab завершился с ошибкой: $LASTEXITCODE"
            exit 1
          }

          $cab = Join-Path $cabDir "$name.cab"

          if (-not (Test-Path $cab)) {
            Write-Error "CAB-файл не создан: $cab"
            exit 1
          }

          Write-Host ""
          Write-Host "Создан пакет:"
          Get-Item $cab | Format-List FullName, Length

      # Проверяем, что CAB действительно существует
      - name: Проверка CAB
        shell: pwsh
        run: |
          Get-ChildItem dist\cab -Filter *.cab

      - uses: actions/upload-artifact@v4
        with:
          name: winralter-x64
          path: dist/cab/*.cab
          
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WinRAlter ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          files: |
            dist/cab/winralter-${{ github.ref_name }}-x64.cab
